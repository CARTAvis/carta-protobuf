# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  apt_packages:
    - default-jre
    - protobuf-compiler
    - librsvg2-bin
  tools:
    python: "3.11"
  jobs:
    pre_build:
        - curl -L -O "https://github.com/pseudomuto/protoc-gen-doc/releases/download/v1.5.1/protoc-gen-doc_1.5.1_linux_amd64.tar.gz"
        - tar xf protoc-gen-doc_1.5.1_linux_amd64.tar.gz -C $READTHEDOCS_VIRTUALENV_PATH/bin
        - make -C docs/protoc
        - curl -L -o "$READTHEDOCS_VIRTUALENV_PATH/plantuml.jar" "https://github.com/plantuml/plantuml/releases/download/v1.2025.8/plantuml-1.2025.8.jar"

formats:
    - pdf

# Build documentation in the docs/ directory with Sphinx
sphinx:
  configuration: docs/src/conf.py

# We recommend specifying your dependencies to enable reproducible builds:
# https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
  - requirements: docs/requirements.txt
