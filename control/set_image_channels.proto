syntax = "proto3";
package CARTA;

import "tiles.proto";

// SET_IMAGE_CHANNELS
// Sets the current image channel and Stokes parameter
message SetImageChannels {
    // The file ID that the view corresponds to
    sfixed32 file_id = 1;
    // The image channel (Z-coordinate)
    sfixed32 channel = 2;
    // The image stokes parameter
    sfixed32 stokes = 3;
    // Required tiles when changing channels
    AddRequiredTiles required_tiles = 4;
    reserved 5, 6;
    // Set current image channel during channel map
    bool channel_map_enabled = 7;
    // Requested channels for a channel map view
    repeated sfixed32 channels = 8;
}
